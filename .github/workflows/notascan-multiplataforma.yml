# NotaScan en Windows, Linux y macOS (paso C de multiplataforma, 2026-11-08).
# Compila la app de escritorio en los tres sistemas, la abre, saca una captura y la mide con
# notascan-desktop/scripts/ci/medir-captura.py. Deja los instaladores y las capturas como artefactos.
#
# Corre en cada PR hacia develop que toque notascan-desktop, o a mano desde la pestaña Actions.
# No corre en cada commit: el repo es privado y los minutos de macOS cuentan diez veces.
#
# Datos de Supabase: si el repo tiene los secretos VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY, se compila la
# versión real. Si no, la de demostración (datos simulados), y se avisa.
# El .dmg sale sin firma de Apple: la primera vez se abre con clic derecho > Abrir.
name: NotaScan en Windows, Linux y macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - "notascan-desktop/**"
      - ".github/workflows/notascan-multiplataforma.yml"

concurrency:
  group: notascan-multiplataforma-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compilar:
    name: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, sistema: windows, bundles: "msi,nsis" }
          - { os: ubuntu-22.04, sistema: linux, bundles: "deb,appimage" }
          - { os: macos-latest, sistema: macos, bundles: "app,dmg" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: notascan-desktop
        shell: bash
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notascan-desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: notascan-desktop/src-tauri -> target

      - name: Librerías de Linux (WebKitGTK y pantalla virtual)
        if: matrix.sistema == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb imagemagick x11-utils xdotool libgl1-mesa-dri

      - name: Dependencias
        run: npm ci && python -m pip install --quiet pillow

      - name: Elegir versión real o de demostración
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "MODO=build" >> "$GITHUB_ENV"
          else
            echo "MODO=build:demo" >> "$GITHUB_ENV"
            echo "::warning::Sin secretos de Supabase en el repo: se compila la versión de demostración."
          fi

      - name: Compilar NotaScan
        run: npx tauri build --bundles ${{ matrix.bundles }} --config "{\"build\":{\"beforeBuildCommand\":\"npm run $MODO\"}}"

      - name: Abrir y capturar (Windows)
        if: matrix.sistema == 'windows'
        shell: pwsh
        run: |
          Start-Process src-tauri/target/release/notascan.exe
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/captura-windows.png")

      - name: Abrir y capturar (Linux)
        if: matrix.sistema == 'linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          export DISPLAY=:99
          sleep 3
          ./src-tauri/target/release/notascan > app-linux.log 2>&1 &
          # Espera hasta 60 s a que exista la ventana; si no aparece, el registro lo dice.
          timeout 60 xdotool search --sync --onlyvisible --name "NotaScan" >> app-linux.log 2>&1 || echo "la ventana no apareció en 60 s" >> app-linux.log
          echo "--- ventanas visibles" >> app-linux.log
          xwininfo -root -tree | grep -i notascan >> app-linux.log || echo "sin ventana NotaScan" >> app-linux.log
          sleep 15
          xwd -root -silent | convert xwd:- png:captura-linux.png

      - name: Abrir y capturar (macOS)
        if: matrix.sistema == 'macos'
        run: |
          open src-tauri/target/release/bundle/macos/NotaScan.app
          sleep 25
          osascript -e 'tell application "NotaScan" to activate' || true
          sleep 3
          screencapture -x captura-macos.png

      - name: Medir la captura
        run: python scripts/ci/medir-captura.py captura-${{ matrix.sistema }}.png ${{ matrix.sistema }} | tee medicion-${{ matrix.sistema }}.txt

      - name: Guardar captura y medición
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captura-${{ matrix.sistema }}
          path: |
            notascan-desktop/captura-${{ matrix.sistema }}.png
            notascan-desktop/medicion-${{ matrix.sistema }}.txt
            notascan-desktop/app-linux.log
          if-no-files-found: ignore

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: NotaScan-${{ matrix.sistema }}
          path: |
            notascan-desktop/src-tauri/target/release/bundle/msi/*.msi
            notascan-desktop/src-tauri/target/release/bundle/nsis/*.exe
            notascan-desktop/src-tauri/target/release/bundle/deb/*.deb
            notascan-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            notascan-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
