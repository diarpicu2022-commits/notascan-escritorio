<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>NotaScan · Subir fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;700;800&display=swap">
<style>
  /* NotaScan · subir desde el celular (2026-10-06). Tokens del sistema ../notascan-ui (marfil, navy, dorado, borde 2 px,
     sombra dura); una sola acción grande. Lectura obligada: nada entre el docente y la cámara. */
  :root { --navy: #1b2a4a; --navy-soft: #33425f; --gold: #b8924b; --ivory: #f7f3ec; --ivory-deep: #efe8dc; --paper: #fffdf8;
    --muted: #5b5a56; --burgundy: #7a2e2e; --sage: #6b8f71; --hairline: rgba(27, 42, 74, .16);
    --font-display: Fraunces, Georgia, serif; --font-ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--ivory); color: var(--navy); font: 400 16px/1.45 var(--font-ui); -webkit-tap-highlight-color: transparent; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); display: grid; gap: 18px; }
  .logo { font: 800 22px/1 var(--font-display); letter-spacing: -.02em; display: inline-flex; align-items: baseline; }
  .logo i { display: inline-block; width: .24em; height: .24em; margin-left: .06em; border-radius: 50%; background: var(--gold); border: 1.5px solid var(--navy); }
  .eyebrow { font: 700 12px/16px var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: #8a6a2f; }
  h1 { margin: 4px 0 0; font: 800 30px/1.05 var(--font-display); letter-spacing: -.02em; }
  .card { background: var(--paper); border: 2px solid var(--navy); border-radius: 16px; box-shadow: 4px 4px 0 var(--navy); padding: 16px; }
  .tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 15px; }
  .tips li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
  .tips b { width: 24px; height: 24px; display: grid; place-items: center; border: 2px solid var(--navy); border-radius: 50%; font: 700 11px/1 var(--font-ui); }
  .shoot { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 76px; border: 2px solid var(--navy);
    border-radius: 999px; background: var(--gold); color: var(--navy); font: 800 20px/1 var(--font-ui); box-shadow: 0 5px 0 var(--navy); cursor: pointer; }
  .shoot:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--navy); }
  .shoot:focus-visible, .ghost:focus-visible, .retry:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
  .ghost { display: block; width: 100%; min-height: 48px; border: 2px solid var(--navy); border-radius: 999px; background: var(--paper); color: var(--navy); font: 700 16px/1 var(--font-ui); cursor: pointer; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .count { display: flex; align-items: baseline; gap: 10px; }
  .count strong { font: 800 44px/1 var(--font-display); font-variant-numeric: lining-nums tabular-nums; }
  .list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .list li { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 8px; border: 2px solid var(--hairline); border-radius: 12px; background: var(--paper); }
  .list img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; border: 1.5px solid var(--navy); }
  .st { font: 600 14px/18px var(--font-ui); } .st small { display: block; font-weight: 400; color: var(--muted); }
  .ok { color: #355e3b; } .bad { color: var(--burgundy); }
  .retry { min-height: 44px; padding: 0 14px; border: 2px solid var(--navy); border-radius: 999px; background: var(--paper); font: 700 14px/1 var(--font-ui); color: var(--navy); }
  .state { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 28px 16px; }
  .state h2 { margin: 0; font: 800 24px/1.15 var(--font-display); }
  .muted { color: var(--muted); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { .shoot:active { transform: none; } }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <span class="logo">NotaScan<i></i></span>
  <div class="card state"><p class="muted">Abriendo…</p></div>
</main>
<script>
(() => {
  const FN = "https://urasrpjslggoknjcxdfp.supabase.co/functions/v1/phone-upload";
  const token = new URLSearchParams(location.search).get("t") || "";
  const app = document.getElementById("app");
  const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const k of kids) e.append(k); return e; };
  const logo = () => { const l = el("span", { class: "logo" }, "NotaScan"); l.append(el("i")); return l; };
  let info = null, sent = 0;
  const items = [];

  function stateCard(title, text) { app.replaceChildren(logo(), el("div", { class: "card state" }, el("h2", {}, title), el("p", { class: "muted" }, text))); }

  async function load() {
    if (!/^[0-9a-f]{64}$/.test(token)) return stateCard("Este enlace no sirve", "Abre la cámara y vuelve a escanear el código QR que muestra NotaScan en el computador.");
    try {
      const r = await fetch(FN + "?t=" + token); const b = await r.json();
      if (!r.ok) return stateCard(r.status === 410 ? "El código venció" : "Este enlace no sirve", b.error || "Vuelve a escanear el código del computador.");
      info = b; sent = b.count || 0; render();
    } catch { stateCard("Sin conexión", "Revisa el Wi-Fi o los datos móviles y vuelve a abrir el enlace."); }
  }

  // La foto se reduce aquí (1568 px, JPEG 0,85), como en el computador: sube rápido y la IA la lee igual.
  function shrink(file) {
    return new Promise((ok, fail) => {
      const img = new Image(); const u = URL.createObjectURL(file);
      img.onload = () => { const k = Math.min(1, 1568 / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg", 0.85)); };
      img.onerror = () => { URL.revokeObjectURL(u); fail(new Error("Ese archivo no es una foto que se pueda leer.")); };
      img.src = u;
    });
  }

  async function send(it) {
    it.state = "sending"; it.msg = "Enviando…"; render();
    try {
      if (!it.data) it.data = await shrink(it.file);
      const r = await fetch(FN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t: token, image: it.data }) });
      const b = await r.json().catch(() => ({}));
      if (!r.ok) { it.state = "error"; it.msg = b.error || "No se envió."; if (r.status === 410) info.expired = true; }
      else { it.state = "ok"; it.msg = "Llegó al computador"; sent = b.count; it.data = null; }
    } catch { it.state = "error"; it.msg = "Sin conexión. Toca «Reintentar»."; }
    render();
  }

  function take(files) {
    for (const f of files) { const it = { file: f, thumb: URL.createObjectURL(f), state: "queued", msg: "En espera" }; items.unshift(it); }
    render();
    (async () => { for (const it of [...items].reverse()) if (it.state === "queued") await send(it); })();
  }

  function render() {
    if (info.expired) return stateCard("El código venció", "Las fotos que llegaron ya están en el computador. Para seguir, genera un código nuevo en NotaScan y escanéalo.");
    const cam = el("input", { type: "file", accept: "image/*", capture: "environment", id: "cam", onchange: (e) => { take([...e.target.files]); e.target.value = ""; } });
    const gal = el("input", { type: "file", accept: "image/*", multiple: "", id: "gal", onchange: (e) => { take([...e.target.files]); e.target.value = ""; } });
    const title = el("div", {}, el("div", { class: "eyebrow" }, [info.subject, info.course].filter(Boolean).join(" · ")), el("h1", {}, info.evaluation));
    const tips = el("div", { class: "card" }, el("ol", { class: "tips" },
      el("li", {}, el("b", {}, "1"), "Hoja completa, sobre una mesa, con el celular justo encima."),
      el("li", {}, el("b", {}, "2"), "Con buena luz y sin sombras ni reflejos."),
      el("li", {}, el("b", {}, "3"), "Que se lean el código, el nombre y la nota.")));
    const shoot = el("button", { class: "shoot", type: "button", onclick: () => cam.click() });
    shoot.innerText = "Tomar foto";
    const galBtn = el("button", { class: "ghost", type: "button", onclick: () => gal.click() }, "Elegir de la galería");
    const count = el("div", { class: "count" }, el("strong", {}, String(sent)), el("span", { class: "muted" }, sent === 1 ? "foto llegó al computador" : "fotos llegaron al computador"));
    const list = el("ul", { class: "list" }, ...items.map((it) => {
      const st = el("div", { class: "st " + (it.state === "ok" ? "ok" : it.state === "error" ? "bad" : "") }, it.msg);
      const li = el("li", {}, el("img", { src: it.thumb, alt: "" }), st);
      li.append(it.state === "error" ? el("button", { class: "retry", type: "button", onclick: () => send(it) }, "Reintentar") : el("span"));
      return li;
    }));
    app.replaceChildren(logo(), title, sent || items.length ? count : tips, shoot, galBtn, cam, gal, list);
  }
  load();
})();
</script>
</body>
</html>
