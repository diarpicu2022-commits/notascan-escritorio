<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotaScan.</title>
  <!-- Tema antes del primer pintado (anexo 2026-11-08-modo-oscuro, O8). Misma regla que src/lib/theme.ts: lo guardado en
       notascan.theme y, si no hay nada o es «system», el modo del sistema. Así la app no abre en claro y salta a oscuro. -->
  <script>
    (function () {
      var p = null;
      try { p = localStorage.getItem("notascan.theme"); } catch (e) {}
      var dark = p === "dark" || (p !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <!-- Mientras llega la hoja de estilos, el lienzo ya es el carbón del tema (--ivory de B). Solo en pantalla y solo en oscuro. -->
  <style>@media screen { html[data-theme="dark"] { color-scheme: dark; background: #161513; } }</style>
  <meta name="description" content="NotaScan: revisión de calificaciones manuscritas. La IA detecta, el docente verifica, el sistema guarda.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%23B8924B' stroke='%231B2A4A' stroke-width='3'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='18' fill='%231B2A4A'%3EN%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="root"></div>
  <noscript>NotaScan necesita JavaScript para funcionar.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
