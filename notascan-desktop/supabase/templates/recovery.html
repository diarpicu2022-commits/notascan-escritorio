<!-- Supabase → Authentication → Emails → «Reset password». Asunto: «Restablece tu contraseña de NotaScan» -->
<h2>Restablece tu contraseña</h2>
<p>Pediste restablecer la contraseña de {{ .Email }} en NotaScan.</p>
<p>En la app, después de «¿Olvidaste tu contraseña?», elige <strong>«Ya tengo el código»</strong> y escribe:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
<p>Si no lo pediste, ignora este correo: tu contraseña no cambia.</p>
